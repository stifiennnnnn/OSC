<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/x-icon" href="assets/LOGO (4) 1.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <title>AD-MEALS</title>
</head>
<body>
    <header class="header">
        <nav>
            <div class="logo-container">
                <img class="logo" src="assets/LOGO (1) 1.png" alt="logo">
            </div>
            <div class="btn-container">
                <button class="hambuger">
                    <a href="index.html"><img src="assets/ARROW.png" alt="back"></a>
                </button>
            </div>
        </nav>
    </header>
    <section class="page">
        <div class="formcon">
            <form class="form">
                <h1>Sign Up</h1><br>
                <label for="fullname">Full Name</label><br>
                <input type="text" name="fullname" id="fullname" placeholder="Enter Your Full Name Here" required><br>
                <label for="email">Email</label><br>
                <input type="text" name="email" id="email" placeholder="Enter Your Email Here" required><br>
                <label for="pass">Password</label><br>
                <input type="password" name="pass" id="pass" placeholder="Enter Your Password Here" required><br>
                <label for="repass">Confirm Your Password</label><br>
                <input type="password" name="repass" id="repass" placeholder="Enter Your Password Here Again" required><br><br>
                <button type="submit" name="signup">Sign Up</button><br>
                <p>Sign In <a href="login.html">Here</a> If You Already Have An Account</p>
            </form>
        </div>
        <div class="gambars">
            <img src="assets/Group 21.png">
        </div>
    </section>
</body>
</html>
