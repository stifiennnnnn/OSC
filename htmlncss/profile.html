<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AD-Meals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="profile.css">
    <link rel="icon" type="image/x-icon" href="assets/LOGO (4) 1.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <!-- HEADER (TIDAK DIUBAH) -->
    <header class="header">
        <nav>
            <div>
                <img class="logo" src="../assets/logo/LOGO (1) 1.png" alt="logo">
            </div>
            <div>
                <button class="hambuger">☰</button>
                <ul class="navli">
                    <li><a href="explore.html">Home</a></li>
                    <li><a href="order.html" class="active">Orders</a></li>
                    <li><a href="history.html">Order History</a></li>
                </ul>
                <button class="notification">
                    <img src="../assets/images/notif.png" alt="notif">
                </button>
                <a href="profile.html">
                    <button class="profileredi">
                        <img src="../assets/images/profile.png" alt="profile">
                    </button>
                </a>
            </div>
        </nav>
    </header>

    <!-- AREA KONTEN PROFIL -->
    <main class="profile-section">
        <div class="profile-container">
            <img src="../assets/logo/Logo background.png" class="bg-pattern" alt="bg">

            <!-- KARTU KIRI (ORANYE) -->
            <div class="rectangle">
                <div class="avatar-section">
                    <img class="avatar" src="../assets/images/profile2.png" alt="Profile">
                    <button class="btn-edit">Edit Profile</button>
                </div>
                <h1 class="greeting">Hi,<br>Dummy!</h1>
            </div>

            <!-- KARTU KANAN (PUTIH) -->
            <div class="rectangle2">
                <div class="user-header">
                    <h2>Dummy <span class="badge">Student</span></h2>
                    <p class="major">2nd Year Design Major</p>
                </div>

                <div class="contact-info">
                    <span class="info-item">
                        <img src="../assets/images/mail.png" alt="mail" class="mail"> dummy123@gmail.com
                    </span>
                    <span class="info-item2">
                        <img src="../assets/images/phone.png" alt="phone" class="phone"> 0812-3456-7899
                    </span>
                </div>

                <hr class="divider">

                <div class="menu-list">
                    <button class="menu-btn">
                        Account info
                        <img src="../assets/images/ARROW2.png" alt="arrow" class="menu-arrow">
                    </button>
                    <button class="menu-btn">
                        Payment method
                        <img src="../assets/images/ARROW2.png" alt="arrow" class="menu-arrow">
                    </button>
                    <button class="menu-btn">
                        Notifications
                        <img src="../assets/images/ARROW2.png" alt="arrow" class="menu-arrow">
                    </button>
                    <button class="menu-btn">
                        Help & FAQ
                        <img src="../assets/images/ARROW2.png" alt="arrow" class="menu-arrow">
                    </button>
                </div>

                <div class="logout-wrapper">
                    <button class="btn-logout">Log out</button>
                </div>
            </div>

        </div>
    </main>
</body>
</html>
