<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AD-Meals</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="payment.css">
        <link rel="icon" type="image/x-icon" href="assets/LOGO (4) 1.png">
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header class="header">
            <nav>
                <a href="preorder.html" class="return">
                    <img src="../assets/images/ARROW.png" alt="Back">
                </a>
                <img class="logo" src="../assets/logo/LOGO (1) 1.png" alt="logo">
            </nav>
        </header>

        <div class="checkout-wrapper">
            <div class="kiri">
                <div class="payment-box">
                    <h2 class="title">Payment</h2>

                    <div class="summary-section">
                        <p class="summary-title">Order Summary:</p>
                        <ul class="summary-list">
                            <li>1x Martabak Telur</li>
                            <li>1x Nasi Ayam Geprek</li>
                            <li>1x Nasi Goreng</li>
                            <li>1x Ayam Gulai</li>
                        </ul>

                        <p class="subtotal-title">Subtotal:</p>
                        <p class="subtotal-price">Rp. 40.000</p>
                    </div>

                    <div class="total-section">
                        <h3>Total:</h3>
                        <h1 class="total-price">Rp. 40.000</h1>
                    </div>

                    <button class="btn-proceed">Proceed To Payment</button>
                </div>
            </div>

            <div class="kanan">
                <div class="method-box">
                    <h2 class="title">Choose Your Payment Method</h2>

                    <div class="payment-grid">
                        <button class="method-card"><img src="../assets/images/qris.png" alt="QRIS"></button>
                        <button class="method-card"><img src="../assets/images/ovo.png" alt="OVO"></button>
                        <button class="method-card"><img src="../assets/images/gopay.png" alt="GoPay"></button>
                        <button class="method-card"><img src="../assets/images/shopeepay.png" alt="ShopeePay"></button>
                        <button class="method-card"><img src="../assets/images/dana.png" alt="DANA"></button>
                        <button class="method-card"><img src="../assets/images/linkaja.png" alt="LinkAja"></button>
                    </div>

                    <button class="btn-see-more">See More</button>
                </div>
            </div>
        </div>     
    </body>
